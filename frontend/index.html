<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduXcel - AI Student Performance Catalyst</title>
    <meta name="description" content="EduXcel uses AI-powered performance prediction to identify students at risk early and guide them toward the right learning path." />
    <meta property="og:title" content="EduXcel — AI Student Performance Catalyst" />
    <meta property="og:description" content="Learn Today • Excel Tomorrow • Succeed Forever" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Prevent FOUC: apply theme before React renders -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('eduxcel-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (prefersDark ? 'dark' : 'light');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
